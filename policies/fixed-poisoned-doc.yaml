# Fixed S2 policy: confirmation gate on untrusted doc content (doc 15 M1).
# Retrieved text is untrusted; mutating calls shaped by doc content need a
# recorded confirmation (above $100 / 10000 cents). The stub summarizes
# instead of acting, so no attacker-controlled args ever execute.
schema_version: policy/v1
rules:
  - rule: on_untrusted_content
    tool: read_doc
    action: require_confirmation
    confirmation:
      above_amount_cents: 10000
      mutating_from_doc: deny_without_approval
