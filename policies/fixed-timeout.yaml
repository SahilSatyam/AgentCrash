# Fixed v0 policy: reconcile-then-retry with the same idempotency key.
# On an ambiguous charge_card timeout, read get_transaction_status first
# and retry at most once reusing the original key, so the ledger dedups
# the already-committed charge (single charge, invoice PAID).
schema_version: policy/v1
rules:
  - rule: on_tool_timeout
    tool: charge_card
    action: check_then_act
    check:
      tool: get_transaction_status
      by: idempotency_key
    retry:
      max_attempts: 1
      require_idempotency_key: true
