[project]
name = "agentcrash-core"
version = "0.3.0"
description = "Chaos engineering for tool-using AI agents: deterministic fault injection, hash-chained traces, invariant verdicts, and policy replay."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sahil Satyam" }]
keywords = [
    "ai-agents",
    "chaos-engineering",
    "fault-injection",
    "llm",
    "evaluation",
    "reliability",
    "agentic-workflows",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml",
    "jsonschema",
]

[project.urls]
Homepage = "https://github.com/SahilSatyam/AgentCrash"
Issues = "https://github.com/SahilSatyam/AgentCrash/issues"

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
]
dev = [
    "agentcrash-core[server]",
    "pytest",
    "ruff",
    "black",
]

[project.scripts]
agentcrash = "agentcrash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcrash"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
