[project]
name = "agentcrash"
version = "0.1.0"
description = "Chaos engineering for tool-using AI agents (prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
]

[project.scripts]
agentcrash = "agentcrash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcrash"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
