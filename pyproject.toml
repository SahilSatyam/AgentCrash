[project]
name = "agentcrash-core"
version = "0.2.0"
description = "Installable reliability framework for agentic workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "jsonschema",
]

[project.optional-dependencies]
host-odrl = [
    "pyshacl",
    "dspy",
    "numpy>=1.26",
]
server = [
    "fastapi",
    "uvicorn",
]
dev = [
    "agentcrash-core[host-odrl,server]",
    "pytest",
    "ruff",
    "black",
]

[project.scripts]
agentcrash = "agentcrash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcrash"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
